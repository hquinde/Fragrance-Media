<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fragrance Collective Carousel</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #e8e6e0; }
    body { display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 32px 0; }
    .slide-wrap {
      width: 1080px;
      height: 1920px;
      flex-shrink: 0;
      box-shadow: 0 24px 64px rgba(0,0,0,0.18);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }
    .slide-caption {
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(22,19,16,0.45);
      margin-top: -16px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    (async () => {
      const c = new URLSearchParams(location.search).get('c') || 'c1';
      const res = await fetch(`${c}-slides.jsx`);
      const code = await res.text();
      const transformed = Babel.transform(code, { presets: ['react'] }).code;
      const s = document.createElement('script');
      s.textContent = transformed;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
